{% load static i18n %}

<!DOCTYPE html>
<html class="no-js" lang="zxx">
  
<meta http-equiv="content-type" content="text/html;charset=utf-8" /><!-- /Added by HTTrack -->
<head>
    <!-- Meta Tags -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="keywords" content="Site keywords here" />
    <meta name="description" content="#" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Site Title -->
    <title>Divine project</title>

    <!-- Fav Icon -->
    <link rel="icon" href="{% static 'frontend/img/favicon.png' %}"/>

    <!--  Stylesheet -->
    <link rel="stylesheet" href="{% static 'frontend/css/bootstrap.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/slick.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/font-awesome-all.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/charts.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/datatables.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/fancy-box.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/nice-select.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/pikaday.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/css/reset.css' %}"/>
    <link rel="stylesheet" href="{% static 'frontend/style.css' %}"/>
</head>
<body id="crancy-dark-light">
    <div class="body-bg">
        <section class="crancy-wc crancy-wc__full crancy-bg-cover">
            <div class="crancy-wc__form">
                <!-- Welcome Banner -->
                <div class="crancy-wc__form--middle">
                    <div class="crancy-wc__form-inner">
                        <div class="crancy-wc__logo">
                            <img src="{% static 'frontend/img/logo.png' %}" alt="#" />
                        </div>
                        <div class="crancy-wc__form-inside">
                            <div class="crancy-wc__form-middle">
                                <div class="crancy-wc__form-top">
                                    {% if messages %}
                                        {% for message in messages %}
                                            <div class="notification {{message.tags}} fl-wrap">
                                                <p>{{ message }}</p>
                                                <a class="notification-close" href="#"><i class="fa fa-times"></i></a>
                                            </div>
                                        {% endfor %}
                                    {% endif %}
                                    <div class="crancy-wc__heading pd-btm-20">
                                        <h3
                                        class="crancy-wc__form-title crancy-wc__form-title__one m-0"
                                        >
                                        Login to your account
                                        </h3>
                                    </div>
                                    <!-- Sign in Form -->
                                    <form
                                        class="crancy-wc__form-main"
                                        action="{% url 'account:login' %}"
                                        method="POST"
                                    >
                                        {% csrf_token %}
                                        <!-- Form Group -->
                                        <div class="form-group">
                                        <div class="form-group__input">
                                            <input
                                            class="crancy-wc__form-input"
                                            type="text"
                                            name="username"
                                            placeholder="Username"
                                            required
                                            />
                                        </div>
                                        </div>
                                        <!-- Form Group -->
                                        <div class="form-group">
                                        <div class="form-group__input">
                                            <input
                                            class="crancy-wc__form-input"
                                            placeholder="Password"
                                            id="password-field"
                                            type="password"
                                            name="password"
                                            maxlength="8"
                                            required
                                            />
                                            <span class="crancy-wc__toggle"
                                            ><i class="fas fa-eye" id="toggle-icon"></i
                                            ></span>
                                        </div>
                                        </div>
                                        <!-- Form Group -->
                                        <div class="form-group mg-top-30">
                                        <div class="crancy-wc__button">
                                            <button class="ntfmax-wc__btn" type="submit">
                                            Sign in
                                            </button>
                                        </div>
                                        </div>
                                    </form>
                                    <!-- End Sign in Form -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div
                        class="crancy-wc__banner crancy-bg-cover"
                        style="background-image: url('../../../static/frontend/img/welcome-vector-shape.png')"
                    >
                        <div class="crancy-wc__banner--img">
                        <img src="{% static 'frontend/img/welcome-vector.png' %}" alt="#" />
                        </div>
                        <div class="crancy-wc__slider">
                        
                        <!-- Sinlge Slider -->
                        <div class="single-slider">
                            <div class="crancy-wc__slider--single">
                            <div class="crancy-wc__slider--content">
                                <h4 class="crancy-wc__slider--title">
                                Sign in & Get the Access to Manage Apps
                                </h4>
                                <p class="crancy-wc__slider--text">
                                Curates the best new blockchain jobs at leading
                                companies that use blockchain technology
                                </p>
                            </div>
                            </div>
                        </div>
                        
                        </div>
                    </div>
                </div>
                <!-- End Welcome Banner -->
            </div>
        </section>
    </div>

<!--  Scripts -->
<script src="{% static 'frontend/js/jquery.min.js' %}"></script>
<script src="{% static 'frontend/js/jquery-migrate.js' %}"></script>
<script src="{% static 'frontend/js/popper.min.js' %}"></script>
<script src="{% static 'frontend/js/bootstrap.min.js' %}"></script>
<script src="{% static 'frontend/js/slick.min.js' %}"></script>
<script src="{% static 'frontend/js/charts.js' %}"></script>
<script src="{% static 'frontend/js/final-countdown.min.js' %}"></script>
<script src="{% static 'frontend/js/fancy-box.min.js' %}"></script>
<!-- <script src="js/datatables.min.js"></script> -->
<script src="{% static 'frontend/js/circle-progress.min.js' %}"></script>
<script src="{% static 'frontend/js/nice-select.min.js' %}"></script>
<script src="{% static 'frontend/js/pikaday.min.js' %}"></script>
<script src="{% static 'frontend/js/main.js' %}"></script>

<script>
    var crancyWCSlider = jQuery(".crancy-wc__slider").slick({
    slidesToShow: 1,
    slidesToScroll: 1,
    dots: true,
    fade: true,
    infinite: true,
    arrows: false,
    speed: 300,
    slidesToShow: 1,
    adaptiveHeight: true,
    });
</script>
</body>
</html>
